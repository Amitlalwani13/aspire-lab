backend:
  name: git-gateway
  branch: main # Change to your default branch if different

logo_url: https://aspirelab.netlify.app/favicon.ico

site_url: https://aspirelab.netlify.app
display_url: https://aspirelab.netlify.app

media_folder: "images/uploads"
public_folder: "/images/uploads"
publish_mode: editorial_workflow

collections:
  - name: "team"
    label: "Team Members"
    folder: "content/team"
    create: true
    slug: "{{name}}"
    fields:
      - {label: "Name", name: "name", widget: "string", required: true}
      - {label: "Role", name: "role", widget: "string"}
      - {label: "Photo", name: "photo", widget: "image", required: true}
      - {label: "Email", name: "email", widget: "string"}
      - {label: "Bio", name: "bio", widget: "textarea"}

  - name: "pages"
    label: "Pages"
    files:
      - file: "content/about.md"
        label: "About Page"
        name: "about"
        fields:
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Description", name: "description", widget: "markdown"}

      - file: "content/contact.md"
        label: "Contact Page"
        name: "contact"
        fields:
          - {label: "Email", name: "email", widget: "string"}
          - {label: "Phone", name: "phone", widget: "string"}
          - {label: "Address", name: "address", widget: "textarea"}
