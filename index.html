<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">

<style>
/* ---------- THEME VARIABLES ---------- */
body[data-theme="midnight"]{
  --bg:radial-gradient(circle at 10% 5%,rgba(6,182,212,.20),transparent 30%),radial-gradient(circle at 90% 20%,rgba(139,92,246,.22),transparent 30%),#060a18;
  --alt:rgba(255,255,255,.025);--card:rgba(255,255,255,.05);--nav:rgba(6,10,24,.78);
  --ink:#e6ecff;--ink2:#c3cdee;--muted:#9fb0d6;--head:#fff;--line:rgba(120,160,255,.20);
  --g:linear-gradient(135deg,#22d3ee,#818cf8 55%,#e879f9);--acc:#22d3ee;
  --foot:#03050f;--r:20px;--close:invert(1);--hf:'Space Grotesk',sans-serif;
  --sh:0 0 0 1px rgba(34,211,238,.06),0 20px 50px rgba(0,0,0,.45);
}
body[data-theme="editorial"]{
  --bg:#faf6ef;--alt:#f2ecdf;--card:#fffdf8;--nav:rgba(250,246,239,.94);
  --ink:#1a1a1a;--ink2:#1a1a1a;--muted:#5b574e;--head:#111;--line:#1a1a1a;
  --g:linear-gradient(90deg,#ea580c,#ea580c);--acc:#ea580c;
  --foot:#111;--r:2px;--close:none;--hf:'Playfair Display',serif;
  --sh:6px 6px 0 #1a1a1a;
}
body[data-theme="forest"]{
  --bg:radial-gradient(circle at 5% 10%,rgba(16,185,129,.16),transparent 30%),radial-gradient(circle at 95% 70%,rgba(20,184,166,.14),transparent 30%),#f2faf6;
  --alt:rgba(209,250,229,.35);--card:rgba(255,255,255,.92);--nav:rgba(242,250,246,.9);
  --ink:#0f2e25;--ink2:#14463a;--muted:#4b6b61;--head:#064e3b;--line:rgba(5,150,105,.20);
  --g:linear-gradient(135deg,#059669,#0d9488 55%,#65a30d);--acc:#059669;
  --foot:linear-gradient(135deg,#064e3b,#115e59);--r:34px;--close:none;--hf:'Playfair Display',serif;
  --sh:0 18px 45px rgba(5,100,70,.12);
}

/* ---------- SHARED OVERRIDES ---------- */
body[data-theme]{background:var(--bg)!important;color:var(--ink);transition:background .4s,color .4s}
body[data-theme] .navbar{background:var(--nav)!important;border-bottom:1px solid var(--line)}
body[data-theme] .nav-link{color:var(--ink2)!important}
body[data-theme] .nav-link:hover{color:var(--acc)!important}
body[data-theme] .navbar-toggler-icon{filter:var(--close)}
body[data-theme] .navbar-brand,
body[data-theme] .hero h1{font-family:var(--hf);background:var(--g);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
body[data-theme] .section:nth-of-type(even){background:var(--alt)}
body[data-theme] .section-title{color:var(--head);font-family:var(--hf)}
body[data-theme] .section-title::after{background:var(--g);box-shadow:none}
body[data-theme] .hero p{background:var(--nav);color:var(--ink);border:1px solid var(--line);backdrop-filter:blur(10px)}
body[data-theme] .glass,
body[data-theme] .gallery-card,
body[data-theme] .poster-card,
body[data-theme] .pub-card,
body[data-theme] .resource-card,
body[data-theme] .contact-glass{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
body[data-theme] .pub-card{border-left:6px solid var(--acc);border-image:none}
body[data-theme] .glass:hover,
body[data-theme] .gallery-card:hover,
body[data-theme] .poster-card:hover,
body[data-theme] .resource-card:hover{border-color:var(--acc)}
body[data-theme] h3,body[data-theme] h5,body[data-theme] h6,
body[data-theme] .profile-heading{color:var(--head);font-family:var(--hf)}
body[data-theme] .text-secondary,
body[data-theme] .profile-text,
body[data-theme] .gallery-meta,
body[data-theme] #about-text,
body[data-theme] .resource-card p,
body[data-theme] small{color:var(--muted)!important}
body[data-theme] .research-card{border-radius:var(--r)}
body[data-theme] .team-img,
body[data-theme] .profile-modal-img{border-color:var(--acc)}
body[data-theme] .profile-btn{background:var(--g);border-radius:var(--r);border-radius:min(var(--r),999px)}
body[data-theme] .resource-icon{background:var(--g);-webkit-background-clip:text;background-clip:text}
body[data-theme] .resource-category{background:var(--alt);color:var(--acc);border:1px solid var(--line)}
body[data-theme] .resource-link,
body[data-theme] .text-primary,
body[data-theme] .contact-glass .fa-paper-plane{color:var(--acc)!important}
body[data-theme] .poster-img-wrapper{background:var(--alt)}
body[data-theme] .modal-content{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:var(--r)}
body[data-theme] .modal-header,body[data-theme] .modal-footer{border-color:var(--line)}
body[data-theme] .btn-close{filter:var(--close)}
body[data-theme] footer{background:var(--foot)}

/* Editorial extras: hard edges, no lift */
body[data-theme="editorial"] .glass:hover,
body[data-theme="editorial"] .gallery-card:hover,
body[data-theme="editorial"] .poster-card:hover,
body[data-theme="editorial"] .resource-card:hover{transform:translate(-3px,-3px);box-shadow:9px 9px 0 #1a1a1a}
body[data-theme="editorial"] .team-img{border-radius:0}
body[data-theme="editorial"] .research-card{border:2px solid #1a1a1a}
body[data-theme="editorial"] .profile-btn{border-radius:0}

/* ---------- SWITCHER ---------- */
#themeFab{position:fixed;right:18px;bottom:18px;z-index:2000;font-family:'Inter',sans-serif}
#themeFab button.main{width:54px;height:54px;border:0;border-radius:50%;font-size:1.3rem;color:#fff;
  background:linear-gradient(135deg,#2563eb,#7c3aed,#ec4899);box-shadow:0 10px 28px rgba(60,40,160,.4);cursor:pointer}
#themePanel{display:none;position:absolute;right:0;bottom:64px;background:#fff;border-radius:16px;padding:8px;
  box-shadow:0 18px 45px rgba(0,0,0,.25);min-width:170px}
#themePanel.open{display:block}
#themePanel button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:10px 12px;
  border-radius:10px;font-weight:600;color:#1a1a1a;cursor:pointer;text-align:left}
#themePanel button:hover,#themePanel button.on{background:#eef2ff}
#themePanel i{width:16px;height:16px;border-radius:50%;display:inline-block;border:1px solid rgba(0,0,0,.15)}
</style>

<script>
function aspireThemeInit(){
  const themes=[
    {id:"aurora",name:"Aurora",c:"linear-gradient(135deg,#2563eb,#ec4899)"},
    {id:"midnight",name:"Midnight",c:"linear-gradient(135deg,#22d3ee,#818cf8,#e879f9)"},
    {id:"editorial",name:"Editorial",c:"linear-gradient(135deg,#faf6ef 50%,#ea580c 50%)"},
    {id:"forest",name:"Forest",c:"linear-gradient(135deg,#059669,#65a30d)"}
  ];
  const fab=document.createElement("div");
  fab.id="themeFab";
  fab.innerHTML='<div id="themePanel"></div><button class="main" aria-label="Change theme" title="Change theme">🎨</button>';
  document.body.appendChild(fab);
  const panel=fab.querySelector("#themePanel");

  function fixContactLink(){
    document.querySelectorAll('.contact-glass a[href^="mailto:"]').forEach(a=>{
      if(document.body.dataset.theme) a.style.setProperty("color","var(--head)","important");
      else a.style.setProperty("color","#000000","important");
    });
  }
  function apply(id){
    if(id==="aurora") document.body.removeAttribute("data-theme");
    else document.body.dataset.theme=id;
    try{localStorage.setItem("aspireTheme",id)}catch(e){}
    panel.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.id===id));
    fixContactLink();
  }
  themes.forEach(t=>{
    const b=document.createElement("button");
    b.dataset.id=t.id;
    b.innerHTML='<i style="background:'+t.c+'"></i>'+t.name;
    b.onclick=()=>{apply(t.id);panel.classList.remove("open")};
    panel.appendChild(b);
  });
  fab.querySelector(".main").onclick=()=>panel.classList.toggle("open");

  const box=document.getElementById("contact-content");
  if(box) new MutationObserver(fixContactLink).observe(box,{childList:true});

  let saved="aurora";
  try{saved=localStorage.getItem("aspireTheme")||"aurora"}catch(e){}
  apply(saved);
}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",aspireThemeInit);else aspireThemeInit();
</script>
