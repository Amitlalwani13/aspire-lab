<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ASPIRE Lab</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">

<style>
body {
  background:#0a0e1a;
  color:white;
  font-family:sans-serif;
}

.section {padding:100px 0;}

.glass {
  background:rgba(255,255,255,0.05);
  padding:2rem;
  border-radius:20px;
  backdrop-filter:blur(20px);
}

.research-card {
  height:250px;
  background-size:cover;
  border-radius:20px;
  position:relative;
}

.research-overlay {
  position:absolute;
  bottom:0;
  padding:1rem;
  width:100%;
  background:linear-gradient(transparent, black);
}
</style>
</head>

<body>

<!-- HERO -->
<section class="section text-center">
<h1>ASPIRE Lab</h1>
<p>Structural Biology • Drug Discovery</p>
</section>

<!-- PROTEIN VIEWER -->
<section class="section text-center">
<h2>Protein Structure</h2>
<div id="viewer" style="height:400px;"></div>
</section>

<!-- RESEARCH -->
<section class="section">
<div class="container">
<div class="row">

<div class="col-md-4">
<div class="research-card"
style="background-image:url('https://lh3.googleusercontent.com/d/1pzhRROZTLh_owdh3BIw8lnLmhrSvC78E')">
<div class="research-overlay">
Structural Parasitology
</div>
</div>
</div>

<div class="col-md-4">
<div class="research-card"
style="background-image:url('https://lh3.googleusercontent.com/d/1Blz9KNiZ5rQhsuQ_YDry10pj82Mn8mne')">
<div class="research-overlay">
Ferritin Nanocages
</div>
</div>
</div>

<div class="col-md-4">
<div class="research-card"
style="background-image:url('https://lh3.googleusercontent.com/d/1XRXbRxBQEMmbNvvbU0pXOQid6guIGgR8')">
<div class="research-overlay">
Drug Discovery
</div>
</div>
</div>

</div>
</div>
</section>

<!-- TEAM -->
<section class="section">
<div class="container">
<h2>Team</h2>
<div id="team-container">Loading...</div>
</div>
</section>

<!-- PUBLICATIONS -->
<section class="section">
<div class="container">
<h2>Publications</h2>
<div id="pub-container">Loading...</div>
</div>
</section>

<!-- SCRIPTS -->
<script src="https://3Dmol.org/build/3Dmol-min.js"></script>
<script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>

<script>
AOS.init();

// 3D Protein
let viewer = $3Dmol.createViewer("viewer", {backgroundColor:"black"});
$3Dmol.download("pdb:1FHA", viewer, {}, function() {
  viewer.setStyle({}, {cartoon:{color:'spectrum'}});
  viewer.zoomTo();
  viewer.render();
});

// TEAM
async function loadTeam() {
const res = await fetch("https://opensheet.elk.sh/1vhSco35e3yQHCFiFJoAmjbHKZ7WV2RQN65xNbK6TIl8/TEAM");
const data = await res.json();

let html = "";

data.forEach(m => {
html += `
<div class="glass mb-3">
<h5>${m.Name}</h5>
<p>${m.Role}</p>
<img src="${m.Image}" width="100">
</div>`;
});

document.getElementById("team-container").innerHTML = html;
}
loadTeam();

// PUBLICATIONS
async function loadPublications() {
const res = await fetch("https://opensheet.elk.sh/1vhSco35e3yQHCFiFJoAmjbHKZ7WV2RQN65xNbK6TIl8/PUBLICATIONS");
const data = await res.json();

let html = "";

data.slice(0,5).forEach(p => {
html += `
<div class="glass mb-3">
<h6>${p.Title}</h6>
<p>${p.Authors}</p>
</div>`;
});

document.getElementById("pub-container").innerHTML = html;
}
loadPublications();
</script>

</body>
</html>
