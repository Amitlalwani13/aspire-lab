<!-- Bootstrap -->

<style>
:root {
  --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  --glass-bg: rgba(255,255,255,0.1);
  --glass-border: rgba(255,255,255,0.2);
  --text-primary: #ffffff;
  --text-secondary: rgba(255,255,255,0.8);
  --bg-primary: #0a0a23;
}

body {
  font-family: 'Inter', sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
}

.navbar {
  background: rgba(10,10,35,0.95)!important;
  backdrop-filter: blur(20px);
}

.navbar-brand {
  font-family: 'Playfair Display';
  font-size: 2rem;
  background: var(--primary-gradient);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.hero-slider .swiper-slide {
  height: 100vh;
  background-size: cover;
  background-position: center;
}

.slide1 { background-image: linear-gradient(rgba(0,0,0,0.5),rgba(0,0,0,0.5)),url('https://images.unsplash.com/photo-1581093588401-12c6a6e1c77f?w=1920'); }
.slide2 { background-image: linear-gradient(rgba(0,0,0,0.5),rgba(0,0,0,0.5)),url('https://images.unsplash.com/photo-1532187863486-abf9dbad1b69?w=1920'); }
.slide3 { background-image: linear-gradient(rgba(0,0,0,0.5),rgba(0,0,0,0.5)),url('https://images.unsplash.com/photo-1576086213369-97a306d36557?w=1920'); }

.overlay {
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  background:var(--glass-bg);
  padding:3rem;
  border-radius:20px;
  text-align:center;
}

.section { padding:100px 0; }

.section-title {
  text-align:center;
  font-size:3rem;
  margin-bottom:3rem;
  background:var(--primary-gradient);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.glass-card {
  background:var(--glass-bg);
  padding:2rem;
  border-radius:20px;
  text-align:center;
  transition:.3s;
}
.glass-card:hover { transform:translateY(-8px); }

.team-img {
  width:150px;height:150px;
  border-radius:50%;
  object-fit:cover;
}

.footer {
  background:#000;
  padding:2rem;
  text-align:center;
}
</style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark fixed-top">
<div class="container">
<a class="navbar-brand" href="#">ASPIRE Lab</a>
</div>
</nav>

<!-- HERO -->
<section class="hero-slider">
<div class="swiper">
<div class="swiper-wrapper">

<div class="overlay">

<p>Structural Parasitology & Protein Engineering</p>
</div>
</div>

<div class="swiper-slide slide2">
<div class="overlay">
<h1>Drug Discovery</h1>
<p>Iron metabolism & therapeutics</p>
</div>
</div>

<div class="overlay">
<h1>Protein Engineering</h1>
<p>Nanocage delivery systems</p>
</div>
</div>

</div>
</div>
</section>

<!-- TEAM -->
<section id="team" class="section">
<div class="container">
<h2 class="section-title">Our Team</h2>

<!-- ✅ ONLY THIS (dynamic) -->
<div class="row text-center" id="team-container"></div>

</div>
</section>

<footer class="footer">
<p>© 2026 ASPIRE Lab</p>
</footer>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

<script>
new Swiper('.swiper',{loop:true,autoplay:{delay:4000}});
</script>

<!-- ✅ TEAM LOADER (FINAL VERSION) -->
<script>
async function loadTeam() {
  const url = "https://api.github.com/repos/Amitlalwani13/aspire-lab/contents/content/team";

  try {
    const res = await fetch(url);
    const files = await res.json();

    let html = "";

    for (let file of files) {
      const fileRes = await fetch(file.download_url);
      const text = await fileRes.text();

      const name = text.match(/name:\s*(.*)/)?.[1] || "Unknown";
      const role = text.match(/role:\s*(.*)/)?.[1] || "";
      const image = text.match(/image:\s*(.*)/)?.[1] || "https://via.placeholder.com/150";

      html += `
        <div class="col-md-3 mb-4">
          <div class="glass-card">
            <img src="${image}" class="team-img mb-3">
            <h5>${name}</h5>
            <p>${role}</p>
          </div>
        </div>
      `;
    }

    document.getElementById("team-container").innerHTML = html;

  } catch (error) {
    console.error("Error loading team:", error);
  }
}
loadTeam();
</script>

</body>
</html>
