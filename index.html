<!DOCTYPE html> 
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ASPIRE Lab | Advanced Structural Parasitology & Protein Engineering</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
/* (KEEP YOUR CSS SAME — unchanged) */
:root {
  --primary-gradient: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 50%, #ec4899 100%);
  --glass-bg: rgba(255,255,255,0.06);
  --glass-border: rgba(255,255,255,0.12);
  --text-primary: #ffffff;
  --text-secondary: rgba(255,255,255,0.8);
}

body {
  margin:0;
  font-family:'Inter', sans-serif;
  background: radial-gradient(circle at top, #0a0e1a, #01050f);
  color:var(--text-primary);
  overflow-x:hidden;
}

/* keep rest same */
</style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark fixed-top">
<div class="container">
<a class="navbar-brand">ASPIRE Lab</a>
<button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav"></button>
<div class="collapse navbar-collapse" id="nav">
<ul class="navbar-nav ms-auto">
<li class="nav-item"><a class="nav-link" href="#about">About</a></li>
<li class="nav-item"><a class="nav-link" href="#research">Research</a></li>
<li class="nav-item"><a class="nav-link" href="#team">Team</a></li>
<li class="nav-item"><a class="nav-link" href="#publications">Publications</a></li>
<li class="nav-item"><a class="nav-link" href="#contact">Contact</a></li>
</ul>
</div>
</div>
</nav>

<!-- HERO -->
<section class="hero">
<div>
<h1>ASPIRE Lab</h1>
<p>Advanced Structural Parasitology • Protein Engineering • Drug Discovery</p>
</div>
</section>

<!-- ABOUT -->
<section id="about" class="section text-center">
<div class="container">
<h2 class="section-title">About ASPIRE Lab</h2>
<div id="about-container"></div>
</div>
</section>

<!-- RESEARCH -->
<section id="research" class="section">
<div class="container">
<h2 class="section-title">Research Areas</h2>
<div class="row g-4" id="research-container"></div>
</div>
</section>

<!-- PI -->
<section class="section text-center">
<div class="container">
<h2 class="section-title">Principal Investigator</h2>
<div class="row justify-content-center" id="pi-container"></div>
</div>
</section>

<!-- TEAM -->
<section id="team" class="section">
<div class="container">
<h2 class="section-title">Our Team</h2>
<div class="row" id="team-container"></div>
</div>
</section>

<!-- PUBLICATIONS -->
<section id="publications" class="section">
<div class="container">
<h2 class="section-title">Publications</h2>
<div id="pub-container"></div>
</div>
</section>

<!-- CONTACT -->
<section id="contact" class="section text-center">
<div class="container">
<h2 class="section-title">Contact</h2>
<div id="contact-container"></div>
</div>
</section>

<footer>
<div class="container">
<p class="mb-0" style="opacity:0.8;">© 2026 ASPIRE Lab</p>
</div>
</footer>

<!-- JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- ABOUT -->
<script>
async function loadAbout() {
const url = "https://opensheet.elk.sh/1vhSco35e3yQHCFiFJoAmjbHKZ7WV2RQN65xNbK6TIl8/ABOUT";
const res = await fetch(url);
const data = await res.json();

const text = data[0]?.text || data[0]?.Text || "";

document.getElementById("about-container").innerHTML = `
<div class="glass p-5" style="max-width:900px; margin:auto;">
<p class="fs-5">${text}</p>
</div>`;
}
loadAbout();
</script>

<!-- RESEARCH -->
<script>
async function loadResearch() {
const url = "https://opensheet.elk.sh/1vhSco35e3yQHCFiFJoAmjbHKZ7WV2RQN65xNbK6TIl8/RESEARCH";
const res = await fetch(url);
const data = await res.json();

let html = "";

data.forEach(r => {
const title = r.title || r.Title || "";
const desc = r.description || r.Description || "";
const image = r.image || r.Image || "";

html += `
<div class="col-md-4">
<div class="research-card" style="background-image:linear-gradient(rgba(0,0,0,0.7),rgba(0,0,0,0.95)),url('${image}')">
<div class="research-overlay">
<h5 style="font-family:'Playfair Display'; font-size:1.4rem;">${title}</h5>
<p>${desc}</p>
</div>
</div>
</div>`;
});

document.getElementById("research-container").innerHTML = html;
}
loadResearch();
</script>

<!-- CONTACT -->
<script>
async function loadContact() {
const url = "https://opensheet.elk.sh/1vhSco35e3yQHCFiFJoAmjbHKZ7WV2RQN65xNbK6TIl8/CONTACT";
const res = await fetch(url);
const data = await res.json();

const email = data[0]?.email || data[0]?.Email || "";
const address = data[0]?.address || data[0]?.Address || "";

document.getElementById("contact-container").innerHTML = `
<div class="glass contact-glass py-5 px-4">
<div class="fs-4 mb-4">
<i class="fas fa-paper-plane text-primary me-3"></i>Get In Touch
</div>

<i class="fas fa-envelope fs-5 me-3"></i><strong>${email}</strong><br><br>

<i class="fas fa-map-marker-alt fs-5 me-3"></i><strong>${address}</strong>
</div>`;
}
loadContact();
</script>

<!-- TEAM -->
<script>
async function loadTeam() {
const url = "https://opensheet.elk.sh/1vhSco35e3yQHCFiFJoAmjbHKZ7WV2RQN65xNbK6TIl8/TEAM";
const res = await fetch(url);
const data = await res.json();

let teamHTML = "";
let piHTML = "";

data.forEach(m => {
const name = m.name || m.Name;
const role = m.role || m.Role;
const image = m.image || m.Image || "https://via.placeholder.com/150";

const card = `
<div class="col-lg-3 col-md-4 col-sm-6 mb-4">
<div class="glass text-center p-4">
<img src="${image}" class="team-img mb-3">
<h5>${name}</h5>
<p class="text-secondary">${role}</p>
</div>
</div>`;

if(role && role.toLowerCase().includes("principal")){
piHTML += card;
}else{
teamHTML += card;
}
});

document.getElementById("pi-container").innerHTML = piHTML;
document.getElementById("team-container").innerHTML = teamHTML;
}
loadTeam();
</script>

<!-- PUBLICATIONS -->
<script>
async function loadPublications() {
const url = "https://opensheet.elk.sh/1vhSco35e3yQHCFiFJoAmjbHKZ7WV2RQN65xNbK6TIl8/PUBLICATIONS";
const res = await fetch(url);
const data = await res.json();

let html = "";

data.reverse().slice(0,8).forEach(p => {
const title = p.title || p.Title || "Untitled";
const authors = p.authors || p.Authors || "";
const journal = p.journal || p.Journal || "";
const year = p.year || p.Year || "";
const link = p.link || p.Link || "";

html += `
<div class="pub-card">
<h6 class="fw-bold">${title}</h6>
<p>${authors}</p>
<small>${journal}, ${year}</small>
${link ? `<br><a href="${link}" target="_blank">View Paper</a>` : ""}
</div>`;
});

document.getElementById("pub-container").innerHTML = html;
}
loadPublications();
</script>

</body>
</html>
