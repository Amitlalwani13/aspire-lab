<!DOCTYPE html> 
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ASPIRE Lab | Advanced Structural Parasitology & Protein Engineering</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
/* GLOBAL */
:root {
  --primary-gradient: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 50%, #ec4899 100%);
  --glass-bg: rgba(255,255,255,0.06);
  --glass-border: rgba(255,255,255,0.12);
  --text-primary: #ffffff;
  --text-secondary: rgba(255,255,255,0.8);
}

body {
  margin:0;
  font-family:'Inter', sans-serif;
  background: radial-gradient(circle at top, #0a0e1a, #01050f);
  color:var(--text-primary);
  overflow-x:hidden;
  line-height:1.6;
}

/* NAVBAR */
.navbar {
  background: rgba(0,0,0,0.95)!important;
  backdrop-filter: blur(30px);
  border-bottom: 1px solid var(--glass-border);
  padding: 1rem 0;
  position: fixed;
  top: 0;
  width: 100%;
  z-index: 1000;
}
.navbar-brand {
  font-family:'Playfair Display';
  font-size:2.2rem;
  font-weight:700;
  background: var(--primary-gradient);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.nav-link {
  color: var(--text-secondary)!important;
  margin: 0 0.75rem;
}
.nav-link:hover { color: #3b82f6 !important; }

/* HERO (UNCHANGED) */
.hero {
  height:100vh;
  background: 
    linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.95)),
    url("https://lh3.googleusercontent.com/d/1bixRBwYia7U1ZMcF_qGGCKLb_ASKpdV8");
  background-size:cover;
  background-position:center;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.hero h1 {
  font-size:4.5rem;
  font-family:'Playfair Display';
}

.section {padding:120px 0;}

.glass {
  background: var(--glass-bg);
  backdrop-filter: blur(30px);
  border-radius:24px;
  padding:2.5rem;
}

/* RESEARCH */
.research-card {
  height:280px;
  background-size:cover;
  background-position:center;
  border-radius:24px;
  position:relative;
}
.research-overlay {
  position:absolute;
  bottom:0;
  width:100%;
  background:linear-gradient(transparent, rgba(0,0,0,0.95));
  padding:2rem 1.5rem;
}

/* TEAM */
.team-img {
  width:140px;
  height:140px;
  border-radius:50%;
  object-fit:cover;
}

/* PUBLICATIONS */
.pub-card {
  background: var(--glass-bg);
  padding:1.8rem;
  border-radius:18px;
  margin-bottom:1.5rem;
}
</style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark fixed-top">
<div class="container">
<a class="navbar-brand">ASPIRE Lab</a>
<div class="collapse navbar-collapse">
<ul class="navbar-nav ms-auto">
<li class="nav-item"><a class="nav-link" href="#about">About</a></li>
<li class="nav-item"><a class="nav-link" href="#research">Research</a></li>
<li class="nav-item"><a class="nav-link" href="#team">Team</a></li>
<li class="nav-item"><a class="nav-link" href="#publications">Publications</a></li>
</ul>
</div>
</div>
</nav>

<!-- HERO -->
<section class="hero">
<div>
<h1>ASPIRE Lab</h1>
<p>Advanced Structural Parasitology • Protein Engineering • Drug Discovery</p>
</div>
</section>

<!-- ABOUT -->
<section id="about" class="section text-center">
<div class="container">
<h2>About ASPIRE Lab</h2>
<div class="glass">
<p id="about-text">Loading...</p>
</div>
</div>
</section>

<!-- RESEARCH -->
<section id="research" class="section">
<div class="container">
<h2>Research Areas</h2>
<div class="row g-4" id="research-container"></div>
</div>
</section>

<!-- TEAM -->
<section id="team" class="section">
<div class="container">
<h2>Team</h2>
<div class="row" id="team-container"></div>
</div>
</section>

<!-- PUBLICATIONS -->
<section id="publications" class="section">
<div class="container">
<h2>Publications</h2>
<div id="pub-container"></div>
</div>
</section>

<!-- JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
// ABOUT
async function loadAbout() {
const url = "https://opensheet.elk.sh/1vhSco35e3yQHCFiFJoAmjbHKZ7WV2RQN65xNbK6TIl8/ABOUT";
const res = await fetch(url);
const data = await res.json();
document.getElementById("about-text").innerHTML = data[0].text;
}

// RESEARCH
async function loadResearch() {
const url = "https://opensheet.elk.sh/1vhSco35e3yQHCFiFJoAmjbHKZ7WV2RQN65xNbK6TIl8/RESEARCH";
const res = await fetch(url);
const data = await res.json();

let html = "";
data.forEach(r => {
html += `
<div class="col-md-4">
<div class="research-card" style="background-image:url('${r.image}')">
<div class="research-overlay">
<h5>${r.title}</h5>
<p>${r.description}</p>
</div>
</div>
</div>`;
});

document.getElementById("research-container").innerHTML = html;
}

// TEAM (UNCHANGED)
async function loadTeam() {
const url = "https://opensheet.elk.sh/1vhSco35e3yQHCFiFJoAmjbHKZ7WV2RQN65xNbK6TIl8/TEAM";
const res = await fetch(url);
const data = await res.json();

let html = "";
data.forEach(m => {
html += `
<div class="col-md-3">
<img src="${m.image}" class="team-img">
<h5>${m.name}</h5>
<p>${m.role}</p>
</div>`;
});

document.getElementById("team-container").innerHTML = html;
}

// PUBLICATIONS (UNCHANGED)
async function loadPublications() {
const url = "https://opensheet.elk.sh/1vhSco35e3yQHCFiFJoAmjbHKZ7WV2RQN65xNbK6TIl8/PUBLICATIONS";
const res = await fetch(url);
const data = await res.json();

let html = "";
data.forEach(p => {
html += `<div class="pub-card">${p.title}</div>`;
});

document.getElementById("pub-container").innerHTML = html;
}

// CALL ALL
loadAbout();
loadResearch();
loadTeam();
loadPublications();
</script>

</body>
</html>
