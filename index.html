<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ASPIRE Lab | Advanced Structural Parasitology & Protein Engineering</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root {
  --primary-gradient: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 50%, #ec4899 100%);
  --glass-bg: rgba(255,255,255,0.06);
  --glass-border: rgba(255,255,255,0.12);
  --text-primary: #ffffff;
  --text-secondary: rgba(255,255,255,0.8);
}

body {
  margin:0;
  font-family:'Inter', sans-serif;
  background: radial-gradient(circle at top, #0a0e1a, #01050f);
  color:var(--text-primary);
  overflow-x:hidden;
  line-height:1.6;
}

/* NAVBAR */
.navbar {
  background: rgba(0,0,0,0.95)!important;
  backdrop-filter: blur(30px);
  border-bottom: 1px solid var(--glass-border);
  padding: 1rem 0;
  position: fixed;
  top: 0;
  width: 100%;
  z-index: 1000;
}
.navbar-brand {
  font-family:'Playfair Display';
  font-size:2.2rem;
  font-weight:700;
  background: var(--primary-gradient);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.nav-link {
  color: var(--text-secondary)!important;
  margin: 0 0.75rem;
}
.nav-link:hover { color: #3b82f6 !important; }

/* HERO */
.hero {
  height:100vh;
  background:
    linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.95)),
    url("https://lh3.googleusercontent.com/d/1bixRBwYia7U1ZMcF_qGGCKLb_ASKpdV8");
  background-size:cover;
  background-position:center;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
}

/* SECTION */
.section {padding:120px 0;}

/* GLASS */
.glass {
  background: var(--glass-bg);
  backdrop-filter: blur(30px);
  border-radius:24px;
  padding:2.5rem;
  border:1px solid var(--glass-border);
}

/* RESEARCH */
.research-card {
  height:280px;
  background-size:cover;
  background-position:center;
  border-radius:24px;
  position:relative;
  overflow:hidden;
}
.research-overlay {
  position:absolute;
  bottom:0;
  width:100%;
  background:linear-gradient(transparent, rgba(0,0,0,0.95));
  padding:2rem 1.5rem;
}

/* TEAM */
.team-img {
  width:140px;
  height:140px;
  border-radius:50%;
  object-fit:cover;
}
</style>
</head>

<body>

<!-- HERO -->
<section class="hero">
<div>
<h1>ASPIRE Lab</h1>
<p>Advanced Structural Parasitology • Protein Engineering • Drug Discovery</p>
</div>
</section>

<!-- RESEARCH -->
<section class="section">
<div class="container">
<div class="row g-4">

<div class="col-md-4">
<div class="research-card" style="background-image:url('https://lh3.googleusercontent.com/d/1pzhRROZTLh_owdh3BIw8lnLmhrSvC78E')">
<div class="research-overlay">
<h5>Structural Parasitology</h5>
</div>
</div>
</div>

<div class="col-md-4">
<div class="research-card" style="background-image:url('https://lh3.googleusercontent.com/d/1Blz9KNiZ5rQhsuQ_YDry10pj82Mn8mne')">
<div class="research-overlay">
<h5>Ferritin Nanocages</h5>
</div>
</div>
</div>

<div class="col-md-4">
<div class="research-card" style="background-image:url('https://lh3.googleusercontent.com/d/1XRXbRxBQEMmbNvvbU0pXOQid6guIGgR8')">
<div class="research-overlay">
<h5>Drug Discovery</h5>
</div>
</div>
</div>

</div>
</div>
</section>

<!-- TEAM -->
<section class="section">
<div class="container">
<h2>Team</h2>
<div id="team-container"></div>
</div>
</section>

<script>
async function loadTeam() {
const res = await fetch("https://opensheet.elk.sh/1vhSco35e3yQHCFiFJoAmjbHKZ7WV2RQN65xNbK6TIl8/TEAM");
const data = await res.json();

let html = "";

data.forEach(m => {
let image = m.image || m.Image || "";

// FIX: convert google drive links
if(image.includes("drive.google.com")){
  const id = image.split("/d/")[1]?.split("/")[0];
  if(id){
    image = "https://lh3.googleusercontent.com/d/" + id;
  }
}

html += `
<div class="glass mb-3 text-center">
<img src="${image}" class="team-img mb-2">
<h5>${m.Name}</h5>
<p>${m.Role}</p>
</div>`;
});

document.getElementById("team-container").innerHTML = html;
}
loadTeam();
</script>

</body>
</html>
